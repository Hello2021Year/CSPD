[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-prompt-distillation"
version = "0.1.0"
description = "Auditable implementation of off-policy soft-prompt distillation"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "math-verify==0.5.2",
  "pylatexenc==2.10",
  "sympy>=1.13",
]

[project.optional-dependencies]
train = [
  "torch>=2.5",
  "transformers>=4.51",
  "safetensors>=0.5",
  "accelerate>=1.0",
  "liger-kernel==0.8.1",
]
flash_attention = ["flash-attn>=2.7,<3"]
# This adapter uses the 0.5.5 public Engine.async_generate interface and is
# tested against this exact build. Upgrade intentionally with runtime tests.
sglang = ["sglang==0.5.5.post3", "ninja>=1.11"]
data = [
  "huggingface_hub>=0.30",
  "pyarrow>=18",
]
test = ["pytest>=8"]

[project.scripts]
soft-prompt-distill = "soft_prompt_distillation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
