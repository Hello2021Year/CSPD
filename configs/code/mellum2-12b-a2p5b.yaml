# Mellum2 Instruct checkpoints on an explicitly labeled Klear proxy.
schema_version: 1
name: mellum2-12b-a2p5b-instruct-klear-proxy-code-lcb-v6-sp256-q4-cap2-2ep-lr0p01-constant
task: mellum_klear_proxy_code

models:
  student: JetBrains/Mellum2-12B-A2.5B-Instruct-SFT
  teacher: JetBrains/Mellum2-12B-A2.5B-Instruct
  revision:
    student: 396c8455b4fb14867b9cd620353b213b493f3a64
    teacher: 273d9c1c6882ac8e1562e5b7e043857d35a787b6
  context_length:
    student: 131072
    teacher: 131072

template:
  source: teacher
  system:
    mode: text
    text: You are an expert Python programmer. You will be given a question (problem specification) and will generate a correct Python program that matches the specification and passes all tests.
  user:
    field: problem
    prefix: "<|soft_prompt|>"
    suffix: ""
  add_generation_prompt: true

data:
  sampling:
    num_prompts: 8192
  evaluation:
    livecodebench_v6:
      num_prompts: all

sampling:
  trajectory_filter: correct_only
  generation:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_new_tokens: 81920
    samples_per_prompt: 4
    stop_token_ids:
      - 28
    provenance: >-
      Explicit Klear-CodeSub proxy: pinned Kwai-Klear/KlearReasoner-CodeSub-15K
      revision 92b67015a1e84cb596dadcdc09462006c83c8a9a, deterministic reservoir
      seed 42, 8192 prompts x4, after excluding 81 audit-pinned LCB near
      duplicates. This is not Mellum2's unpublished RLVR mix.

distillation:
  objective: response_sft
  # Transformers 5 is required for Mellum2, while the Blackwell runtime's
  # flash-attn namespace does not expose the Transformers FA2 CUDA extension.
  # PyTorch SDPA is native in this runtime and preserves the same objective.
  attention_implementation: sdpa
  activation_checkpointing: true
  checkpoint_every_updates: 20
  prompt_length: 256
  max_sequence_length: 40000
  overlength_policy: filter
  max_trajectories_per_question: 2
  prompt_init:
    method: sampled_vocabulary
  insertion:
    mode: placeholder
    marker: "<|soft_prompt|>"
    sentinel_id: -200
    occurrence: exactly_one
  optimizer: adamw
  learning_rate: 0.01
  schedule:
    name: constant
    warmup_steps: 0
    min_lr_ratio: 1.0
  effective_batch_size: 128
  micro_batch_size: 1
  cross_entropy_backend: liger_fused
  loss_normalization: sequence
  batch_seed: 42
  epochs: 2
  weight_decay: 0.0
  max_grad_norm: 10.0

evaluation:
  arms:
    student:
      generation: &mellum_eval
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        max_new_tokens: 81920
        samples_per_prompt: 1
        stop_token_ids:
          - 28
        provenance: Mellum2 effective greedy pass@1 contract; paper's T=0.2 annotation is inactive under greedy
    teacher:
      generation: *mellum_eval
    student_soft_prompt:
      generation: *mellum_eval
